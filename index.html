            .head { display: grid; gap: 8px; margin-bottom: 12px; }

            .cap { font-size: 12.5px; line-height: 16px; color: var(--ink-muted); margin: 0; }

                background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); outline: 0;

            .staticrypt-toggle-password-visibility {

            .staticrypt-remember input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }
            .staticrypt-form .staticrypt-decrypt-button {
